project:
  type: default
  output-dir: output
execute:
  enabled: false
filters:
  - styles/career.lua
format:
  pdf:
    pdf-engine: xelatex
    documentclass: article
    papersize: letter
    fontsize: 11pt
    mainfont: Calibri
    sansfont: Calibri
    geometry:
      - left=1.9cm
      - right=1.9cm
      - top=1.65cm
      - bottom=1.65cm
    toc: false
    number-sections: false
    colorlinks: true
    urlcolor: cvlink
    linkcolor: cvlink
    keep-tex: true
    latex-auto-install: false
    include-in-header: styles/pdf-header.tex
  docx:
    reference-doc: styles/reference.docx
    toc: false
    number-sections: false
    highlight-style: none

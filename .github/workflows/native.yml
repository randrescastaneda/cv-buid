name: Installed starter rendering
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install setuptools==80.9.0
      - run: python scripts/build_package.py
      - name: Verify source-distribution clean installation
        shell: bash
        run: python scripts/check_sdist.py dist/review-wheel/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cv-buid-review-wheel
          path: dist/review-wheel/
          retention-days: 14
  render:
    needs: wheel
    name: Real rendering (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cv-buid-review-wheel
          path: dist/review-wheel
      - name: Verify and install the exact same review wheel
        run: |
          python -c "import pathlib,hashlib,subprocess,sys; p=pathlib.Path('dist/review-wheel'); w=next(p.glob('*.whl')); assert hashlib.sha256(w.read_bytes()).hexdigest()==(p/'SHA256SUMS').read_text().split()[0]; subprocess.run([sys.executable,'-m','pip','install','--no-deps',str(w)],check=True)"
      - run: python scripts/ci_tools.py
      - run: quarto install tinytex --no-prompt
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/ci_tools.py --tex-path
      - name: Configure declared TeX dependencies
        run: python scripts/ci_tex.py
      - name: Real installed-command acceptance, builtin and script backends
        run: python tests/check_starter.py --artifacts dist/native-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-starter-${{ matrix.os }}
          path: dist/native-evidence/
          retention-days: 14

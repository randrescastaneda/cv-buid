[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-buid"
version = "0.1.2.dev0"
description = "Local evidence-backed CV profiles, review diffs, and Quarto exports"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[project.scripts]
cv-buid = "cv_buid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv_buid = ["assets/*.md"]
